<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>文章管理</title>
    <link rel="stylesheet" href="/css/Site.css" th:href="@{/css/Site.css}"/>
    <link rel="stylesheet" href="/css/all.css" th:href="@{/css/all.css}"/>
    <link rel="stylesheet" href="/css/font-awesome.min.css" th:href="@{/css/font-awesome.min.css}"/>
    <link rel="stylesheet" href="/css/amazeui.min.css" th:href="@{/css/amazeui.min.css}"/>
    <link rel="stylesheet" href="/css/admin.css" th:href="@{/css/admin.css}"/>
    <link href="/resources/bootstrap-3.3.7-dist/css/bootstrap.min.css" th:href="@{/resources/bootstrap-3.3.7-dist/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body id="article-admin"
      th:attr="data-list-url=@{/article/list},data-delete-url=@{/article/del/},data-detail-url=@{/article/get/},data-add-url=@{/article/add},data-update-url=@{/article/update},data-upload-url=@{/upload}">
<div class="dvcontent">

    <div>
        <!--tab start-->
        <div class="tabs">
            <div class="hd">
                <ul style="">
                    <li id="articleManager" style="box-sizing: initial;-webkit-box-sizing: initial;" class="on">文章管理</li>
                    <li id="writeBlog" class="" style="box-sizing: initial;-webkit-box-sizing: initial;">写博客</li>
                </ul>
            </div>
            <div class="bd">
                <div id="articleAttributes" style="display: block;padding: 20px;">
                    <div>
                        <!--分页显示角色信息 start-->
                        <div id="dv1">
                            <table class="table" id="tbRecord">
                                <thead>
                                <tr>
                                    <th><input type="checkbox" id="check_all" /></th>
                                    <th>文章标题</th>
                                    <th>文章标签</th>
                                    <th>浏览量</th>
                                    <th>点赞数</th>
                                    <th>评论数</th>
                                    <th>热度</th>
                                    <th>创建时间</th>
                                    <th>更新时间</th>
                                    <th>操作</th>
                                </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                        <div class="row">
                            <div class="col-md-6" id="page_info_area"></div>
                            <div class="col-md-6" id="page_nav_area"></div>
                            &nbsp;&nbsp;<button class="btn btn-danger" id="emp_delete_all_btn">批量删除</button>
                        </div>
                        <!--分页显示角色信息 end-->
                    </div>
                </div>
                <div id="articleEdit" class="theme-popbod dform" style="display: none;">
                    <div class="am-cf admin-main" style="padding-top: 0px;">
                        <!-- content start -->
                        <div class="modal-body">
                            <form id="form" method="post">
                                <div class="form-group">
                                    <label for="articleTitle">标题</label>
                                    <input id="articleTitle" class="form-control" type="text" name="articleTitle" placeholder="标题">
                                </div>
                                <label for="articleTag">标签</label>
                                <input id="articleTag" class="form-control" type="text" name="articleTag" placeholder="标签">
                                <div id="articleEditor">
                                    <!--编辑器-->
                                </div>
                                <div class="modal-footer">
                                    <button id="submitBtn" type="button" class="btn btn-primary">发布文章</button>
                                </div>
                            </form>
                        </div>
                        <!-- end-->
                    </div>
                </div>
            </div>
        </div>
        <!--tab end-->

    </div>


    <script src="/js/jquery-1.12.4.min.js" th:src="@{/js/jquery-1.12.4.min.js}" type="text/javascript"></script>
    <script src="/js/plugs/Jqueryplugs.js" th:src="@{/js/plugs/Jqueryplugs.js}" type="text/javascript"></script>
    <script src="/js/_layout.js" th:src="@{/js/_layout.js}"></script>
    <script src="/js/plugs/jquery.SuperSlide.source.js" th:src="@{/js/plugs/jquery.SuperSlide.source.js}"></script>
    <script src="/resources/bootstrap-3.3.7-dist/js/bootstrap.min.js" th:src="@{/resources/bootstrap-3.3.7-dist/js/bootstrap.min.js}"></script>
    <script type="text/javascript" src="/js/wangEditor.min.js" th:src="@{/js/wangEditor.min.js}"></script>
    <script src="/js/article-admin.js" th:src="@{/js/article-admin.js}"></script>
    <script src="/js/editor.js" th:src="@{/js/editor.js}"></script>

</div>
</body>

</html>
